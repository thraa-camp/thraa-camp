<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>أجزاء النبات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage (a textbook page on a desk); floating header, a guide card at the top and a control bar at the bottom. */
:root{
  --bg:#E3EBE2; --scene:#DCE6DA; --ink:#15241C; --muted:#56685C; --panel:#FAFCF8; --glass:rgba(250,252,248,.88);
  --line:#C5D2C6; --accent:#1D6A58; --accent-ink:#FFFFFF; --paper:#FBF7EC; --paper-ink:#2A2418; --shadow:rgba(20,40,30,.14);
  --c-root:#D9822B; --c-stem:#A7C23A; --c-leaf:#2F9E5B; --c-flower:#B65BD8; --c-fruit:#E2483D; --c-soil:#8A6440;
  --c-water:#2F7FE0; --c-sun:#F2B705; --c-gold:#E0A92E; --c-air:#7D8790; --c-o2:#5DC8F0;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-book:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --scene:#0F1B16; --ink:#E3EDE6; --muted:#9BAFA3; --panel:#16241E; --glass:rgba(22,36,30,.86);
  --line:#2B3E35; --accent:#5BC2A2; --accent-ink:#06231B; --paper:#1E2923; --paper-ink:#ECE5D4; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --scene:#0F1B16; --ink:#E3EDE6; --muted:#9BAFA3; --panel:#16241E; --glass:rgba(22,36,30,.86);
  --line:#2B3E35; --accent:#5BC2A2; --accent-ink:#06231B; --paper:#1E2923; --paper-ink:#ECE5D4; --shadow:rgba(0,0,0,.4); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui)}
#app{position:relative;height:100%;overflow:hidden;direction:rtl}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:4}
.hdr>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font:700 21px/1.1 var(--f-display);letter-spacing:0}
.brand p{margin:2px 0 0;font:500 12px/1.3 var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.tbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font:600 13px/1 var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn[aria-pressed="false"]{color:var(--muted)}
.tbtn svg{width:16px;height:16px}

/* guide card */
.guide{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));z-index:3;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px 10px;box-shadow:0 10px 30px var(--shadow);transition:opacity .3s}
.guide.off{opacity:0;pointer-events:none}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font:700 13px/1 var(--f-ui);padding:6px 10px 6px 12px;border-radius:999px;
  background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}
.count{font:600 12px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
#g-text{margin:9px 2px 8px;font:500 16px/1.75 var(--f-ui);min-height:3.5em;text-wrap:pretty}
.gnav{display:flex;align-items:center;gap:10px}
.gnav button{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font:600 13px/1 var(--f-ui);cursor:pointer}
.gnav button:disabled{opacity:.4;cursor:default}
.gnav #g-next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{flex:1;display:flex;gap:5px;justify-content:center;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .25s}
.dots i.on{width:20px;border-radius:4px;background:var(--c,var(--accent))}
.prog{height:3px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c,var(--accent))}
.prog[hidden]{display:none}

/* bottom bar */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
  padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar-in{pointer-events:auto;display:flex;gap:4px;max-width:100%;overflow-x:auto;padding:6px;border-radius:16px;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px var(--shadow);scrollbar-width:none}
.bar-in::-webkit-scrollbar{display:none}
.bar.locked .bar-in{opacity:.45;pointer-events:none}
.btn{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 13px;border-radius:11px;border:1px solid transparent;
  background:transparent;font:600 14px/1 var(--f-ui);cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
.btn:hover{background:color-mix(in srgb,var(--c,var(--ink)) 10%,transparent)}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 20%,var(--panel));border-color:var(--c,var(--accent))}
.btn svg{width:18px;height:18px;flex:none}
.sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14)}
.sep{flex:none;width:1px;margin:7px 3px;background:var(--line)}
.pop{position:absolute;bottom:72px;z-index:5;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 14px 34px var(--shadow);min-width:200px}
.pop .btn{justify-content:flex-start}
.pop[hidden]{display:none}

/* labels */
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .35s;will-change:transform}
.tag.on{opacity:1}
.tag .pin{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c)}
.tag .lead{position:absolute;top:-.75px;height:1.5px;width:28px;background:var(--ink);opacity:.5}
.tag[data-side="right"] .lead{left:6px}
.tag[data-side="left"] .lead{right:6px}
.tag .pill{position:absolute;top:-15px;height:30px;display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 11px;border-radius:9px;
  background:var(--panel);border:1.5px solid var(--c);font:700 13px/1 var(--f-ui);box-shadow:0 4px 14px var(--shadow)}
.tag[data-side="right"] .pill{left:34px}
.tag[data-side="left"] .pill{right:34px}

/* book panel */
.book{position:absolute;z-index:3;top:64px;bottom:84px;right:max(16px,env(safe-area-inset-right,0px));width:min(410px,44vw);
  background:var(--paper);color:var(--paper-ink);border-radius:6px 16px 16px 6px;border:1px solid var(--line);box-shadow:0 18px 40px var(--shadow);
  overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .5s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.book.open{transform:none;visibility:visible}
.book-in{padding:20px 22px 24px;font-family:var(--f-book)}
.book .bhead{display:flex;align-items:center;gap:10px;justify-content:space-between;font:600 12px/1 var(--f-ui);opacity:.7;border-bottom:1px solid color-mix(in srgb,var(--paper-ink) 20%,transparent);padding-bottom:10px}
.book .lesson{display:inline-block;margin-top:14px;font:700 12px/1 var(--f-ui);padding:6px 10px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.book h2{margin:10px 0 6px;font:700 30px/1.3 var(--f-book);text-wrap:balance}
.book p,.book li{font:400 18px/1.95 var(--f-book)}
.book ul{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px}
.book li{position:relative;padding-right:22px}
.book li::before{content:"";position:absolute;right:2px;top:.8em;width:10px;height:10px;border-radius:50%;background:var(--c)}
.term{font:700 inherit/inherit var(--f-book);font-size:inherit;padding:0 3px;border:0;border-bottom:3px solid var(--c);border-radius:4px 4px 0 0;
  background:color-mix(in srgb,var(--c) 20%,transparent);color:inherit;cursor:pointer}
.term:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.book .fig{margin:14px 0;padding:10px 12px;border:1.5px dashed color-mix(in srgb,var(--paper-ink) 35%,transparent);border-radius:10px;font:500 14px/1.6 var(--f-ui)}
.book .q{margin-top:14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.book .q b{font:700 13px/1 var(--f-ui);color:var(--accent)}
.book .q p{margin:6px 0 8px}
.book .q button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;font:600 13px/1 var(--f-ui);cursor:pointer}
.book .ans{font:700 16px/1.6 var(--f-ui)}
.book .close{flex:none;width:30px;height:30px;margin:-4px 0;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font:700 18px/1 var(--f-ui)}
.book .hint{font:500 13px/1.6 var(--f-ui);opacity:.75;margin:4px 0 0}

/* loading */
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.loading p{font:600 15px/1.6 var(--f-ui);color:var(--muted);text-align:center;padding:0 24px}
.spin{width:38px;height:38px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .brand p{display:none}
  .brand h1{font-size:19px}
  .tbtn span{display:none}
  .guide{top:58px;padding:10px 12px 9px}
  #g-text{font-size:15px;line-height:1.7;min-height:3.4em;margin:7px 2px 6px}
  .btn{height:40px;padding:0 11px;font-size:13px}
  .book{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:80px;max-height:52%;
    border-radius:16px;transform:translateY(calc(100% + 100px))}
  .tag .pill{font-size:12px;height:26px;top:-13px;padding:0 8px}
  .bar-in{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
  .bar-in.end{-webkit-mask-image:none;mask-image:none}
}
@media (prefers-reduced-motion: reduce){ .book,.tag,.guide{transition:none} .spin{animation:none} }
</style>
</head>
<body>

<div id="app" lang="ar" dir="rtl">
  <canvas id="scene" aria-label="نموذج ثلاثي الأبعاد لنبات زهري ينبثق من صفحة كتاب العلوم"></canvas>
  <div class="labels" id="labels" aria-hidden="true"></div>

  <header class="hdr">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V10"/><path d="M12 13c-4 0-6-2.5-6-6 3.5 0 6 2 6 6Z"/><path d="M12 11c0-3.5 2.5-6 6.5-6 0 4-2.5 6-6.5 6Z"/><path d="M8 21h8"/></svg>
      </div>
      <div style="min-width:0">
        <h1>أجزاء النبات</h1>
        <p>العلوم · الفصل الثالث: النباتات · نموذج تفاعلي ثلاثي الأبعاد</p>
      </div>
    </div>
    <div class="tools">
      <button class="tbtn" id="t-labels" aria-pressed="true" title="إظهار الأسماء أو إخفاؤها">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4"/><circle cx="9" cy="12" r="2"/><rect x="12" y="8" width="9" height="8" rx="2"/></svg><span>الأسماء</span>
      </button>
      <button class="tbtn" id="t-replay" title="أعد عرض انبثاق النموذج من الصفحة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><span>أعد الانبثاق</span>
      </button>
    </div>
  </header>

  <section class="guide" id="guide" aria-live="polite">
    <div class="ghead">
      <span class="chip" id="g-chip"><i class="sw" style="--c:var(--accent)"></i><span id="g-mode">صفحة الكتاب</span></span>
      <span class="count" id="g-count"></span>
    </div>
    <p id="g-text">جارٍ فتح الكتاب…</p>
    <div class="gnav">
      <button id="g-prev">السابق</button>
      <div class="dots" id="g-dots"></div>
      <button id="g-next">التالي</button>
    </div>
    <div class="prog" id="g-prog" hidden><i></i></div>
  </section>

  <aside class="book" id="book" aria-label="نص الدرس من الكتاب"></aside>

  <nav class="bar locked" id="bar" aria-label="أدوات التحكم في النموذج">
    <div class="bar-in" role="toolbar">
      <button class="btn" data-mode="overview" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12 20 7.5M12 12v9M12 12 4 7.5"/></svg>عرض كامل
      </button>
      <button class="btn" data-mode="book" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5Z"/><path d="M12 6v14"/></svg>نص الكتاب
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" data-mode="root" style="--c:var(--c-root)" aria-pressed="false"><i class="sw"></i>الجذر</button>
      <button class="btn" data-mode="stem" style="--c:var(--c-stem)" aria-pressed="false"><i class="sw"></i>الساق</button>
      <button class="btn" data-mode="leaf" style="--c:var(--c-leaf)" aria-pressed="false"><i class="sw"></i>الأوراق</button>
      <button class="btn" data-mode="flower" style="--c:var(--c-flower)" aria-pressed="false"><i class="sw"></i>الزهرة</button>
      <button class="btn" data-mode="fruit" style="--c:var(--c-fruit)" aria-pressed="false"><i class="sw"></i>الثمرة والبذور</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="b-proc" aria-pressed="false" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v14l12-7Z"/></svg>العمليات الحيوية
      </button>
    </div>
  </nav>
  <div class="pop" id="pop" hidden role="menu">
    <button class="btn" role="menuitem" data-mode="water" style="--c:var(--c-water)" aria-pressed="false"><i class="sw"></i>امتصاص الماء ونقله</button>
    <button class="btn" role="menuitem" data-mode="photo" style="--c:var(--c-sun)" aria-pressed="false"><i class="sw"></i>البناء الضوئي</button>
    <button class="btn" role="menuitem" data-mode="pollen" style="--c:var(--c-flower)" aria-pressed="false"><i class="sw"></i>التلقيح وتكوّن الثمرة</button>
  </div>

  <div class="loading" id="loading"><div><div class="spin"></div><p id="load-msg">جارٍ تحضير النموذج…</p></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
document.documentElement.lang='ar';
const loadMsg=$('#load-msg');
if(!window.THREE||!THREE.OrbitControls){ loadMsg.textContent='تعذّر تحميل مكتبة العرض ثلاثي الأبعاد. تحقّق من اتصال الإنترنت ثم أعد فتح الصفحة.'; return; }
const NUM=new Intl.NumberFormat('ar-SA');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
let seed=11; const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* ---------- colours (3D) ---------- */
const C={root:0xD9822B,rootHair:0xF3C08A,stem:0xA7C23A,leaf:0x2A9352,vein:0xB9E58E,flower:0xB65BD8,sepal:0x7E3BA0,filament:0xF1E4F6,anther:0xF5C842,
  pistil:0xE6CCF5,fruit:0xE2483D,flesh:0xF7A28F,seed:0xF6E7B9,soil:0x6B4A2B,soilTop:0x5A3D22,xylem:0x2F7FE0,phloem:0xE0A92E};

/* ---------- lesson text (shared by the 3D page and the reading panel) ---------- */
const BOOK={
  subject:'العلوم', unit:'الفصل الثالث: النباتات', lesson:'الدرس الأول', title:'أجزاء النبات', page:'٤٦',
  intro:'للنبات أجزاء رئيسة، لكلّ جزء منها وظيفة تساعد النبات على العيش والنمو والتكاثر.',
  items:[
    {part:'root',text:'{root|الجذر}: يثبّت النبات في التربة، ويمتص منها الماء والأملاح المعدنية.'},
    {part:'stem',text:'{stem|الساق}: تحمل الأوراق والأزهار، وتنقل الماء من الجذر إلى الأوراق، وتنقل الغذاء إلى أجزاء النبات.'},
    {part:'leaf',text:'{leaf|الأوراق}: تصنع غذاء النبات في عملية {leaf|البناء الضوئي} بوجود ضوء الشمس والماء وثاني أكسيد الكربون.'},
    {part:'flower',text:'{flower|الزهرة}: عضو التكاثر في النبات، وفيها تتكوّن البذور بعد {flower|التلقيح}.'},
    {part:'fruit',text:'{fruit|الثمرة}: تتكوّن من مبيض الزهرة، وتحمي {fruit|البذور} وتساعد على انتشارها.'}
  ],
  figure:'الشكل (١): أجزاء النبات الزهري',
  question:'ما الجزء الذي يمتص الماء والأملاح من التربة؟', answer:'الجذر، عن طريق الشعيرات الجذرية.'

function tube(curve,r0,r1,tub=40,rad=10,pw=1){
  const fr=curve.computeFrenetFrames(tub,false),pos=[],nor=[],uv=[],idx=[],P=new THREE.Vector3();
  for(let i=0;i<=tub;i++){const t=i/tub;curve.getPointAt(t,P);const N=fr.normals[i],B=fr.binormals[i],r=r0+(r1-r0)*Math.pow(t,pw);
    for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2,s=Math.sin(a),c=-Math.cos(a);const nx=c*N.x+s*B.x,ny=c*N.y+s*B.y,nz=c*N.z+s*B.z;
      pos.push(P.x+r*nx,P.y+r*ny,P.z+r*nz);nor.push(nx,ny,nz);uv.push(t,j/rad);}}
  for(let i=0;i<tub;i++)for(let j=0;j<rad;j++){const a=i*(rad+1)+j,b=(i+1)*(rad+1)+j;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);return g;
}
function surf(fn,nu,nv){
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=nu;i++){const u=i/nu;for(let j=0;j<=nv;j++){const v=j/nv*2-1,p=fn(u,v);pos.push(p.x,p.y,p.z);uv.push(u,(v+1)/2);}}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();return g;
}
function curveFrom(pts){const out=[];pts.forEach(p=>{if(!out.length||out[out.length-1].distanceTo(p)>.06)out.push(p.clone());});return new THREE.CatmullRomCurve3(out);}

function drawPage(){

  g.fillStyle=INK; g.font=`700 62px ${BOOKF}`; g.fillText(BOOK.title,R,228);
  // figure frame (plant stands here)
  const cy=(PLANT_POS.z+PH/2)/PH*H, fh=(2.85/PH)*H, fTop=cy-fh, fBot=cy+fh;

  const toWords=runs=>{const words=[];let cur=null;runs.forEach(r=>{r.t.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){cur=null;return;}if(!cur){cur={runs:[]};words.push(cur);}cur.runs.push({t:p,part:r.part});});});return words;};
  let size=30,lines,lh,gap;
  const fontFor=(part,sz)=>`${part?700:400} ${sz}px ${BOOKF}`;
  for(;size>=19;size--){

    paras.forEach((p,pi)=>{const indent=p.part?40:0, maxw=MAXW-indent; g.font=fontFor(null,size); const sp=g.measureText(' ').width;
      const words=toWords(p.runs); words.forEach(w=>{w.w=0;w.runs.forEach(r=>{g.font=fontFor(r.part,size);r.w=g.measureText(r.t).width;w.w+=r.w;});});
      let line=[],lw=0; const flush=first=>{lines.push({words:line,indent,part:p.part,first,sp});total+=lh;line=[];lw=0;};
      let first=true; words.forEach(w=>{const add=(line.length?sp:0)+w.w;if(lw+add>maxw&&line.length){flush(first);first=false;}line.push(w);lw+=(line.length>1?sp:0)+w.w;});

  g.fillStyle=INK; g.font=`600 26px ${BOOKF}`; g.textAlign='center'; g.fillText(BOOK.figure,W/2,fBot+44);
  pageTex.needsUpdate=true;
}

$('#t-labels').addEventListener('click',e=>{labelsOn=!labelsOn;e.currentTarget.setAttribute('aria-pressed',String(labelsOn));setLabels(activeLabels);});
$('#t-replay').addEventListener('click',()=>startIntro());
document.addEventListener('keydown',e=>{if(intro){if(e.key==='Escape'||e.key==='Enter')finishIntro();return;}
  if(e.key==='Escape')go('overview');else if(e.key==='ArrowLeft'&&mode&&stepI<mode.steps.length-1){autoOn=false;setStep(stepI+1);}else if(e.key==='ArrowRight'&&mode&&stepI>0){autoOn=false;setStep(stepI-1);}});

/* ---------- reading panel ---------- */
function buildBook(){
  const runsHTML=t=>parseRuns(t).map(r=>{const s=document.createElement(r.part?'button':'span');s.textContent=r.t;if(r.part){s.className='term';s.dataset.part=r.part;s.style.setProperty('--c',`var(${PART_CSS[r.part]})`);s.title='اعرض '+r.t+' في النموذج';}return s.outerHTML;}).join('');
  bookEl.innerHTML=`<div class="book-in">
    <div class="bhead"><span>${BOOK.subject}</span><span style="flex:1;text-align:left">${BOOK.unit} · صفحة ${BOOK.page}</span><button class="close" id="b-close" aria-label="إغلاق نص الكتاب">×</button></div>
    <span class="lesson">${BOOK.lesson}</span><h2>${BOOK.title}</h2>
    <p class="hint">اضغط على أي كلمة ملوّنة لعرض الجزء في النموذج.</p>
    <p>${runsHTML(BOOK.intro)}</p>
    <ul>${BOOK.items.map(it=>`<li style="--c:var(${PART_CSS[it.part]})">${runsHTML(it.text)}</li>`).join('')}</ul>
    <div class="fig">${BOOK.figure}: النموذج ثلاثي الأبعاد الذي ينبثق من هذه الصفحة.</div>
    <div class="q"><b>سؤال</b><p>${BOOK.question}</p><button id="b-ans">أظهر الإجابة</button></div></div>`;
  bookEl.querySelectorAll('.term').forEach(b=>b.addEventListener('click',()=>go(b.dataset.part)));
  $('#b-close').addEventListener('click',()=>go('overview'));
  $('#b-ans').addEventListener('click',e=>{const p=document.createElement('p');p.className='ans';p.textContent=BOOK.answer;e.currentTarget.replaceWith(p);});
}
buildBook();

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
function pick(ev){const r=canvas.getBoundingClientRect();mv.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const hits=ray.intersectObjects(pickables,false);for(const h of hits){const m=h.object.material;if(m.visible&&m.opacity>.3){const p=h.object.userData.part;return p==='soil'?'root':p;}}return null;}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};if(intro)finishIntro();});
canvas.addEventListener('pointerup',e=>{if(!down||intro)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;
  if(d<7&&dt<500){const p=pick(e);if(p&&p!==modeKey)go(p);}});
let lastHover=0;
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||intro)return;const now=performance.now();if(now-lastHover<60)return;lastHover=now;hovered=pick(e);canvas.style.cursor=hovered?'pointer':'grab';});
canvas.addEventListener('pointerleave',()=>{hovered=null;});

/* ---------- intro: the model emerges from the page ---------- */
function startIntro(){
  closePop();bookEl.classList.remove('open');guideEl.classList.remove('off');
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed','false'));procBtn.setAttribute('aria-pressed','false');procBtn.style.removeProperty('--c');
  barEl.classList.add('locked');controls.enabled=false;controls.autoRotate=false;
  modeKey='intro';mode=MODES.intro;stepI=0;intro={t:0,flew:false};resetScene();setGrowth(0);setLabels([]);
  const f=FR.page();camera.position.copy(f.pos);controls.target.copy(f.target);camera.lookAt(f.target);fly=null;
  renderGuide();
  if(REDUCE)finishIntro();
}
function runIntro(dt){
  intro.t+=dt;const T0=1.9,TG=3.4;
  if(intro.t>T0&&!intro.flew){intro.flew=true;stepI=1;renderGuide();flyTo('overview',3.2);ring.material.opacity=.85;F.spark.on=true;intro.flew=true;}
  if(intro.t>T0+TG*.8)F.spark.on=false;
  setGrowth(clamp((intro.t-T0)/TG));
  if(intro.t>T0+TG+.3&&!fly)finishIntro();
}
function finishIntro(){
  if(!intro)return;intro=null;setGrowth(1);F.spark.on=false;fly=null;barEl.classList.remove('locked');controls.enabled=true;
  go('overview');
}

/* ---------- loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  UNI.scale.value=renderer.getDrawingBufferSize(new THREE.Vector2()).y/(2*Math.tan(camera.fov*Math.PI/360));}
window.addEventListener('resize',resize);resize();
let last=performance.now(),time=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(intro)runIntro(dt);
  updateFly(dt);if(!fly&&!intro)controls.update();
  applyRig(dt,time);applyMats(dt,time);flows.forEach(f=>f.update(dt));
  if(mode&&mode.auto&&autoOn&&!intro){stepT+=dt;const n=mode.steps.length;gProg.firstElementChild.style.width=(clamp(stepT/STEP_DUR)*100)+'%';
    if(stepT>=STEP_DUR&&stepI<n-1)setStep(stepI+1);}
  renderer.render(scene,camera);updateLabels();
  requestAnimationFrame(frame);
}
const fontsReady=(document.fonts?Promise.race([Promise.all(['700 40px "Noto Naskh Arabic"','400 26px "Noto Naskh Arabic"','600 20px "IBM Plex Sans Arabic"','700 20px "Reem Kufi"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve());
fontsReady.catch(()=>{}).then(()=>{drawPage();$('#loading').classList.add('done');resize();startIntro();requestAnimationFrame(t=>{last=t;frame(t);});});
})();
</script>
